[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "separan"
version = "0.1.0a1"
description = "Python reference interpreter for the label-structured Separan language"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2", "cryptography>=45,<51", "argon2-cffi>=23,<26"]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
mysql = ["mysql-connector-python>=9,<10"]
oracle = ["oracledb>=3,<5"]
sqlserver = ["pyodbc>=5,<6"]
db-all = [
    "psycopg[binary]>=3.2,<4",
    "mysql-connector-python>=9,<10",
    "oracledb>=3,<5",
    "pyodbc>=5,<6",
]

[project.scripts]
separan = "separan.cli:main"

[tool.setuptools.packages.find]
where = ["reference"]
