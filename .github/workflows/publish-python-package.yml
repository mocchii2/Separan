name: Publish Python package to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distribution
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'vscode-v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as stream:
              package_version = tomllib.load(stream)["project"]["version"]
          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if Version(package_version) != Version(tag_version):
              raise SystemExit(
                  f"tag {os.environ['GITHUB_REF_NAME']!r} does not match "
                  f"package version {package_version!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check --strict dist/*

      - name: Test the built wheel
        shell: bash
        run: |
          python -m venv package-test
          package-test/bin/python -m pip install dist/*.whl
          package-test/bin/separan --timezone-version
          package-test/bin/separan examples/hello.sep

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/separan-lang/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
