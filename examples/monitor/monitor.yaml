    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt ConfigBootstrapRole.Arn
      Code:
        ZipFile: |
          import json,urllib.request,boto3
          from botocore.exceptions import ClientError
          s3=boto3.client("s3")
          def respond(event,context,status,data=None,reason=None):
              body=json.dumps({"Status":status,"Reason":reason or f"See CloudWatch Logs: {context.log_stream_name}","PhysicalResourceId":event.get("PhysicalResourceId","separan-monitor-config"),"StackId":event["StackId"],"RequestId":event["RequestId"],"LogicalResourceId":event["LogicalResourceId"],"NoEcho":False,"Data":data or {}}).encode(); request=urllib.request.Request(event["ResponseURL"],data=body,method="PUT",headers={"content-length":str(len(body)),"content-type":""}); urllib.request.urlopen(request,timeout=10).read()
          def seed(bucket,key,value):
              try: s3.head_object(Bucket=bucket,Key=key)
              except ClientError as exc:
                  if exc.response.get("Error",{}).get("Code") not in ("404","NoSuchKey"): raise
                  s3.put_object(Bucket=bucket,Key=key,Body=json.dumps(value,ensure_ascii=False,indent=2).encode(),ContentType="application/json",ServerSideEncryption="AES256")
          def handler(event,context):
              try:
                  p=event["ResourceProperties"]; bucket=p["Bucket"]
                  if event["RequestType"]!="Delete":
                      seed(bucket,"config/suppression.json",{"version":1,"rules":[{"id":"example-disabled-rule","enabled":False,"notification_types":["B","C"],"resource_ids":[],"windows_sources":["Application Error"],"event_ids":["1000"],"content_contains":"hogehoge"}]})
                      seed(bucket,"config/holidays.json",{"version":1,"timezone":p["Timezone"],"weekly":[{"enabled":False,"days":["SAT","SUN"],"start":"00:00","end":"23:59"}],"dates":[{"enabled":False,"date":"2026-12-31","start":"00:00","end":"23:59"}]})
                  respond(event,context,"SUCCESS",{"Bucket":bucket})
              except Exception as exc: respond(event,context,"FAILED",reason=str(exc))
