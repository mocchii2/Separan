AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Separan Monitor all-in-one deployment. Monitors up to five EC2 instances and
  five RDS DB instances with metrics, Windows/RDS logs, service events, status
  polling, suppression, deduplication, and Email/SMS/Microsoft Teams delivery.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "1. 基本設定 / General"}
        Parameters: [ProjectName, NotificationTimezone, HistoryRetentionDays, DuplicateSuppressionMinutes, StatusCheckSchedule]
      - Label: {default: "2. EC2監視対象（最大5台）"}
        Parameters: [Ec2Instance1, Ec2Name1, Ec2Instance2, Ec2Name2, Ec2Instance3, Ec2Name3, Ec2Instance4, Ec2Name4, Ec2Instance5, Ec2Name5]
      - Label: {default: "3. RDS監視対象（最大5台）"}
        Parameters: [RdsInstance1, RdsName1, RdsLogGroup1, RdsInstance2, RdsName2, RdsLogGroup2, RdsInstance3, RdsName3, RdsLogGroup3, RdsInstance4, RdsName4, RdsLogGroup4, RdsInstance5, RdsName5, RdsLogGroup5]
      - Label: {default: "4. Metricしきい値"}
        Parameters: [AlarmPeriodSeconds, AlarmEvaluationPeriods, Ec2CpuThresholdPercent, Ec2DiskFreeThresholdPercent, RdsCpuThresholdPercent, RdsFreeStorageThresholdBytes]
      - Label: {default: "5. 状態変化後のMetric通知抑制"}
        Parameters: [StartupSuppressionMinutes, ShutdownSuppressionMinutes, RebootSuppressionMinutes]
      - Label: {default: "6. 通知先"}
        Parameters: [EmailAddress, SmsPhoneNumber, EnableTeams, TeamsTenantId, TeamsTeamId, TeamsChannelId]
      - Label: {default: "7. 通知種別ごとの経路"}
        Parameters: [NotificationAChannels, NotificationA2Channels, NotificationBChannels, NotificationCChannels, NotificationDChannels, NotificationEChannels, NotificationFChannels]
      - Label: {default: "8. Windows CloudWatch Agent（任意）"}
        Parameters: [ConfigureWindowsAgents, Ec2IamRoleName]
    ParameterLabels:
      RdsFreeStorageThresholdBytes: {default: "RDS空き容量しきい値（bytes、20GiB=21474836480）"}
      Ec2IamRoleName: {default: "対象EC2が共通で使用するIAM role名"}

Parameters:
  ProjectName: {Type: String, Default: separan-monitor, AllowedPattern: "^[A-Za-z][A-Za-z0-9-]{2,31}$"}
  NotificationTimezone: {Type: String, Default: Asia/Tokyo}
  HistoryRetentionDays: {Type: Number, Default: 30, MinValue: 1, MaxValue: 365}
  DuplicateSuppressionMinutes: {Type: Number, Default: 30, MinValue: 1, MaxValue: 1440}
  StatusCheckSchedule: {Type: String, Default: "rate(5 minutes)"}

  Ec2Instance1: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name1: {Type: String, Default: EC2-1}
  Ec2Instance2: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name2: {Type: String, Default: EC2-2}
  Ec2Instance3: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name3: {Type: String, Default: EC2-3}
  Ec2Instance4: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name4: {Type: String, Default: EC2-4}
  Ec2Instance5: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name5: {Type: String, Default: EC2-5}

  RdsInstance1: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName1: {Type: String, Default: RDS-1}
  RdsLogGroup1: {Type: String, Default: "", Description: "既存のRDS CloudWatch Logs log group名（例 /aws/rds/instance/db/error）"}
  RdsInstance2: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName2: {Type: String, Default: RDS-2}
  RdsLogGroup2: {Type: String, Default: ""}
  RdsInstance3: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName3: {Type: String, Default: RDS-3}
  RdsLogGroup3: {Type: String, Default: ""}
  RdsInstance4: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName4: {Type: String, Default: RDS-4}
  RdsLogGroup4: {Type: String, Default: ""}
  RdsInstance5: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName5: {Type: String, Default: RDS-5}
  RdsLogGroup5: {Type: String, Default: ""}

  AlarmPeriodSeconds: {Type: Number, Default: 300, AllowedValues: [60, 300]}
  AlarmEvaluationPeriods: {Type: Number, Default: 3, MinValue: 1, MaxValue: 12}
  Ec2CpuThresholdPercent: {Type: Number, Default: 90, MinValue: 1, MaxValue: 100}
  Ec2DiskFreeThresholdPercent: {Type: Number, Default: 15, MinValue: 1, MaxValue: 100}
  RdsCpuThresholdPercent: {Type: Number, Default: 90, MinValue: 1, MaxValue: 100}
  RdsFreeStorageThresholdBytes: {Type: Number, Default: 21474836480, MinValue: 104857600}
  StartupSuppressionMinutes: {Type: Number, Default: 15, MinValue: 0, MaxValue: 1440}
  ShutdownSuppressionMinutes: {Type: Number, Default: 5, MinValue: 0, MaxValue: 1440}
  RebootSuppressionMinutes: {Type: Number, Default: 15, MinValue: 0, MaxValue: 1440}

  EmailAddress: {Type: String, Default: "", Description: "空ならEmail通知を作成しません。SNS確認メールの承認が必要です。"}
  SmsPhoneNumber: {Type: String, Default: "", AllowedPattern: "^$|^\\+[1-9][0-9]{7,14}$", Description: "E.164形式。空ならSMS通知を作成しません。"}
  EnableTeams: {Type: String, Default: "false", AllowedValues: ["true", "false"]}
  TeamsTenantId: {Type: String, Default: "", AllowedPattern: "^$|^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$", Description: "Teams無効時は空。Microsoft Entra tenant GUID。"}
  TeamsTeamId: {Type: String, Default: "", AllowedPattern: "^$|^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$", Description: "Teams無効時は空。Microsoft Teams team GUID。"}
  TeamsChannelId: {Type: String, Default: "", AllowedPattern: "^$|^([a-zA-Z0-9-_=+/.,])*%3[aA]([a-zA-Z0-9-_=+/.,])*%40([a-zA-Z0-9-_=+/.,])*$", Description: "Teams無効時は空。Amazon Qに表示されるURL encode済みchannel ID。"}
  NotificationAChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$", Description: "email,sms,teams のcomma区切り"}
  NotificationA2Channels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationBChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationCChannels: {Type: String, Default: "email", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationDChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationEChannels: {Type: String, Default: "email", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationFChannels: {Type: String, Default: "email,sms,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  ConfigureWindowsAgents: {Type: String, Default: "false", AllowedValues: ["true", "false"]}
  Ec2IamRoleName: {Type: String, Default: "", Description: "ConfigureWindowsAgents=true時に必須。対象EC2へattach済みのrole名。"}

Rules:
  WindowsAgentRoleRequired:
    RuleCondition: !Equals [!Ref ConfigureWindowsAgents, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref Ec2IamRoleName, ""]]
        AssertDescription: ConfigureWindowsAgents=true requires Ec2IamRoleName.
  TeamsIdentifiersRequired:
    RuleCondition: !Equals [!Ref EnableTeams, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref TeamsTenantId, ""]]
          - !Not [!Equals [!Ref TeamsTeamId, ""]]
          - !Not [!Equals [!Ref TeamsChannelId, ""]]
        AssertDescription: EnableTeams=true requires tenant, team, and channel IDs.

Conditions:
  HasEc21: !Not [!Equals [!Ref Ec2Instance1, ""]]
  HasEc22: !Not [!Equals [!Ref Ec2Instance2, ""]]
  HasEc23: !Not [!Equals [!Ref Ec2Instance3, ""]]
  HasEc24: !Not [!Equals [!Ref Ec2Instance4, ""]]
  HasEc25: !Not [!Equals [!Ref Ec2Instance5, ""]]
  HasRds1: !Not [!Equals [!Ref RdsInstance1, ""]]
  HasRds2: !Not [!Equals [!Ref RdsInstance2, ""]]
  HasRds3: !Not [!Equals [!Ref RdsInstance3, ""]]
  HasRds4: !Not [!Equals [!Ref RdsInstance4, ""]]
  HasRds5: !Not [!Equals [!Ref RdsInstance5, ""]]
  HasRdsLog1: !And [!Condition HasRds1, !Not [!Equals [!Ref RdsLogGroup1, ""]]]
  HasRdsLog2: !And [!Condition HasRds2, !Not [!Equals [!Ref RdsLogGroup2, ""]]]
  HasRdsLog3: !And [!Condition HasRds3, !Not [!Equals [!Ref RdsLogGroup3, ""]]]
  HasRdsLog4: !And [!Condition HasRds4, !Not [!Equals [!Ref RdsLogGroup4, ""]]]
  HasRdsLog5: !And [!Condition HasRds5, !Not [!Equals [!Ref RdsLogGroup5, ""]]]
  HasEmail: !Not [!Equals [!Ref EmailAddress, ""]]
  HasSms: !Not [!Equals [!Ref SmsPhoneNumber, ""]]
  UseTeams: !Equals [!Ref EnableTeams, "true"]
  ConfigureAgents: !Equals [!Ref ConfigureWindowsAgents, "true"]
  ConfigureAgentEc21: !And [!Condition ConfigureAgents, !Condition HasEc21]
  ConfigureAgentEc22: !And [!Condition ConfigureAgents, !Condition HasEc22]
  ConfigureAgentEc23: !And [!Condition ConfigureAgents, !Condition HasEc23]
  ConfigureAgentEc24: !And [!Condition ConfigureAgents, !Condition HasEc24]
  ConfigureAgentEc25: !And [!Condition ConfigureAgents, !Condition HasEc25]

Resources:
  MonitorTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  MonitorConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  NotifyIngressTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} ingress"}}
  NotifyIngressTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NotifyIngressTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref NotifyIngressTopic
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
  EmailTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} email"}}
  SmsTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} sms"}}
  TeamsTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} teams"}}
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: {Protocol: email, Endpoint: !Ref EmailAddress, TopicArn: !Ref EmailTopic}
  SmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasSms
    Properties: {Protocol: sms, Endpoint: !Ref SmsPhoneNumber, TopicArn: !Ref SmsTopic}

  TeamsRole:
    Type: AWS::IAM::Role
    Condition: UseTeams
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: chatbot.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess]
  TeamsChannel:
    Type: AWS::Chatbot::MicrosoftTeamsChannelConfiguration
    Condition: UseTeams
    Properties:
      ConfigurationName: !Sub "${ProjectName}-teams"
      IamRoleArn: !GetAtt TeamsRole.Arn
      GuardrailPolicies: [arn:aws:iam::aws:policy/ReadOnlyAccess]
      LoggingLevel: ERROR
      SnsTopicArns: [!Ref TeamsTopic]
      TeamId: !Ref TeamsTeamId
      TeamsChannelId: !Ref TeamsChannelId
      TeamsTenantId: !Ref TeamsTenantId
      UserRoleRequired: true

  NotifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: notify
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem], Resource: !GetAtt MonitorTable.Arn}
              - {Effect: Allow, Action: s3:GetObject, Resource: !Sub "${MonitorConfigBucket.Arn}/config/*"}
              - {Effect: Allow, Action: sns:Publish, Resource: [!Ref EmailTopic, !Ref SmsTopic, !Ref TeamsTopic]}

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Applies suppression, stores every candidate, and sends channel-specific notifications.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt NotifyRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitorTable
          CONFIG_BUCKET: !Ref MonitorConfigBucket
          SUPPRESSION_KEY: config/suppression.json
          HOLIDAY_KEY: config/holidays.json
          EMAIL_TOPIC: !Ref EmailTopic
          SMS_TOPIC: !Ref SmsTopic
          TEAMS_TOPIC: !Ref TeamsTopic
          EMAIL_ENABLED: !If [HasEmail, "true", "false"]
          SMS_ENABLED: !If [HasSms, "true", "false"]
          TEAMS_ENABLED: !If [UseTeams, "true", "false"]
          HISTORY_DAYS: !Ref HistoryRetentionDays
          DEDUP_MINUTES: !Ref DuplicateSuppressionMinutes
          DEFAULT_TIMEZONE: !Ref NotificationTimezone
          ROUTES_JSON: !Sub >-
            {"A":"${NotificationAChannels}","A2":"${NotificationA2Channels}","B":"${NotificationBChannels}","C":"${NotificationCChannels}","D":"${NotificationDChannels}","E":"${NotificationEChannels}","F":"${NotificationFChannels}"}
      Code:
        ZipFile: |
          import hashlib, json, os, time, uuid
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import boto3
          from botocore.exceptions import ClientError

          ddb, s3, sns = boto3.client("dynamodb"), boto3.client("s3"), boto3.client("sns")
          TABLE, BUCKET = os.environ["TABLE_NAME"], os.environ["CONFIG_BUCKET"]
          CHANNELS = {
              "email": (os.environ["EMAIL_ENABLED"] == "true", os.environ["EMAIL_TOPIC"]),
              "sms": (os.environ["SMS_ENABLED"] == "true", os.environ["SMS_TOPIC"]),
              "teams": (os.environ["TEAMS_ENABLED"] == "true", os.environ["TEAMS_TOPIC"]),
          }
          ROUTES = json.loads(os.environ["ROUTES_JSON"])
          TYPE_NAMES = {"A":"EC2 metric alert","A2":"RDS metric alert","B":"Windows log keyword","C":"Windows event","D":"RDS log keyword","E":"RDS event","F":"Resource state change"}
          TEMPLATES = {
              "A":{"email":("[EC2 METRIC] {resource_name} {state}","EC2 metric alert\nResource: {resource_name} ({resource_id})\nState: {state}\nDetail: {message}"),"sms":("","EC2 {resource_name}: {title} {state}"),"teams":("EC2 metric: {resource_name}","**{state}** - {message}")},
              "A2":{"email":("[RDS METRIC] {resource_name} {state}","RDS metric alert\nResource: {resource_name} ({resource_id})\nState: {state}\nDetail: {message}"),"sms":("","RDS {resource_name}: {title} {state}"),"teams":("RDS metric: {resource_name}","**{state}** - {message}")},
              "B":{"email":("[WINDOWS LOG] {resource_name}","Windows log keyword matched\nSource: {windows_source}\nEvent ID: {event_id}\nContent: {message}"),"sms":("","Windows log {resource_name}: {message}"),"teams":("Windows log: {resource_name}","Source `{windows_source}` ID `{event_id}`\n{message}")},
              "C":{"email":("[WINDOWS EVENT] {resource_name} ID={event_id}","Windows event received\nSource: {windows_source}\nEvent ID: {event_id}\nContent: {message}"),"sms":("","Windows event {resource_name} ID={event_id}"),"teams":("Windows event: {resource_name}","Source `{windows_source}` ID `{event_id}`\n{message}")},
              "D":{"email":("[RDS LOG] {resource_name}","RDS log keyword matched\nLog: {source}\nContent: {message}"),"sms":("","RDS log {resource_name}: {message}"),"teams":("RDS log: {resource_name}","Log `{source}`\n{message}")},
              "E":{"email":("[RDS EVENT] {resource_name}","RDS service event\nResource: {resource_name}\nEvent: {message}"),"sms":("","RDS event {resource_name}: {message}"),"teams":("RDS event: {resource_name}","{message}")},
              "F":{"email":("[STATE] {resource_name} {state}","Resource state changed\nType: {resource_type}\nResource: {resource_name} ({resource_id})\nState: {state}\nDetail: {message}"),"sms":("","State {resource_name}: {state}"),"teams":("State change: {resource_name}","**{state}** - {message}")},
          }
          class Safe(dict):
              def __missing__(self, key): return "-"

          def load(key, default):
              try:
                  value = json.loads(s3.get_object(Bucket=BUCKET, Key=key)["Body"].read())
                  return value if isinstance(value, dict) else default
              except ClientError as exc:
                  if exc.response.get("Error",{}).get("Code") in ("NoSuchKey","NoSuchBucket"): return default
                  raise

          def clock_minutes(value):
              hour, minute = (int(part) for part in value.split(":"))
              if hour not in range(24) or minute not in range(60): raise ValueError(f"Invalid time: {value}")
              return hour * 60 + minute

          def weekly_window(local, entry):
              days={str(value).upper() for value in entry.get("days",[])}; now=local.hour*60+local.minute; start=clock_minutes(entry.get("start","00:00")); end=clock_minutes(entry.get("end","23:59")); today=local.strftime("%a").upper()
              if start <= end: return today in days and start <= now <= end
              if now >= start: return today in days
              yesterday=(local-timedelta(days=1)).strftime("%a").upper(); return now <= end and yesterday in days

          def date_window(local, entry):
              target=datetime.strptime(entry.get("date",""),"%Y-%m-%d").date(); now=local.hour*60+local.minute; start=clock_minutes(entry.get("start","00:00")); end=clock_minutes(entry.get("end","23:59"))
              if start <= end: return local.date()==target and start <= now <= end
              return (local.date()==target and now>=start) or (local.date()==target+timedelta(days=1) and now<=end)

          def holiday(config, epoch):
              try: zone=ZoneInfo(config.get("timezone") or os.environ["DEFAULT_TIMEZONE"])
              except Exception:
                  try: zone=ZoneInfo(os.environ["DEFAULT_TIMEZONE"])
                  except Exception: zone=timezone.utc
              local=datetime.fromtimestamp(epoch,zone)
              for entry in config.get("weekly",[]):
                  if entry.get("enabled") and weekly_window(local,entry): return "HOLIDAY_WEEKLY"
              for entry in config.get("dates",[]):
                  if entry.get("enabled") and date_window(local,entry): return "HOLIDAY_DATE"
              return ""

          def rule_match(c, rule):
              if not rule.get("enabled",False): return False
              for key, actual in (("notification_types",c.get("notification_type","")),("resource_ids",c.get("resource_id","")),("windows_sources",c.get("windows_source","")),("event_ids",str(c.get("event_id","")))):
                  wanted = rule.get(key,[])
                  if wanted and str(actual).casefold() not in {str(value).casefold() for value in wanted}: return False
              needle = str(rule.get("content_contains","")).casefold()
              return not needle or needle in str(c.get("message","")).casefold()

          def transition_grace(c, epoch):
              if c.get("notification_type") not in ("A","A2") or not c.get("resource_id"): return False
              resource_type = c.get("resource_type","").upper()
              item = ddb.get_item(TableName=TABLE,Key={"pk":{"S":f"STATE#{resource_type}#{c['resource_id']}"},"sk":{"S":"CURRENT"}},ConsistentRead=True).get("Item",{})
              return epoch < int(item.get("suppress_metrics_until",{}).get("N","0"))

          def reserve_duplicate(c, epoch):
              raw = "|".join(str(c.get(k,"")) for k in ("notification_type","resource_id","state","title","message"))
              digest = hashlib.sha256(raw.encode()).hexdigest(); expires = epoch + int(os.environ["DEDUP_MINUTES"])*60
              try:
                  ddb.put_item(TableName=TABLE,Item={"pk":{"S":f"DEDUP#{digest}"},"sk":{"S":"CURRENT"},"expires_at":{"N":str(expires)}},ConditionExpression="attribute_not_exists(pk) OR expires_at < :now",ExpressionAttributeValues={":now":{"N":str(epoch)}})
                  return digest
              except ClientError as exc:
                  if exc.response.get("Error",{}).get("Code") == "ConditionalCheckFailedException": return None
                  raise

          def release_duplicate(digest):
              ddb.delete_item(TableName=TABLE,Key={"pk":{"S":f"DEDUP#{digest}"},"sk":{"S":"CURRENT"}})

          def clip(value, max_bytes): return str(value).encode("utf-8")[:max_bytes].decode("utf-8","ignore")

          def history(c, epoch, status, reason):
              ttl = epoch + int(os.environ["HISTORY_DAYS"])*86400
              ddb.put_item(TableName=TABLE,Item={"pk":{"S":"HISTORY#"+datetime.fromtimestamp(epoch,timezone.utc).strftime("%Y-%m-%d")},"sk":{"S":f"{epoch:010d}#{uuid.uuid4()}"},"notification_type":{"S":str(c.get("notification_type","UNKNOWN"))},"resource_id":{"S":str(c.get("resource_id","UNKNOWN"))},"status":{"S":status},"suppression_reason":{"S":reason or "NONE"},"payload":{"S":clip(json.dumps(c,ensure_ascii=False,default=str),60000)},"expires_at":{"N":str(ttl)}})

          def publish(c):
              kind = c.get("notification_type","F"); requested = {x.strip().lower() for x in ROUTES.get(kind,"email").split(",") if x.strip()}; delivered=[]
              for channel in ("email","sms","teams"):
                  enabled, topic = CHANNELS[channel]
                  if channel not in requested or not enabled: continue
                  subject_template, body_template = TEMPLATES.get(kind,TEMPLATES["F"])[channel]; values=Safe(c)
                  subject, body = clip(subject_template.format_map(values).replace("\n"," ").replace("\r"," "),100), body_template.format_map(values)
                  if channel == "teams": body=json.dumps({"version":"1.0","source":"custom","id":str(uuid.uuid4()),"content":{"textType":"client-markdown","title":subject,"description":clip(body,8000),"keywords":[kind,c.get("resource_type","unknown")]},"metadata":{"threadId":f"{c.get('resource_type','resource')}#{c.get('resource_id','unknown')}","summary":subject,"eventType":kind}},ensure_ascii=False)
                  args={"TopicArn":topic,"Message":body}
                  if subject and channel == "email": args["Subject"]=subject
                  sns.publish(**args); delivered.append(channel)
              return delivered

          def alarm(value):
              try: c=json.loads(value.get("AlarmDescription","{}"))
              except Exception: c={}
