AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Separan Monitor native runtime deployment. Monitors up to five EC2 instances and
  five RDS DB instances with metrics, Windows/RDS logs, service events, status
  polling, suppression, deduplication, and Email/SMS/Microsoft Teams delivery.
  All four Lambda entrypoints execute the same packaged Separan application.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: "1. General settings"}
        Parameters: [ProjectName, NotificationTimezone, HistoryRetentionDays, DuplicateSuppressionMinutes, StatusCheckSchedule]
      - Label: {default: "2. EC2 targets (up to 5)"}
        Parameters: [Ec2Instance1, Ec2Name1, Ec2Instance2, Ec2Name2, Ec2Instance3, Ec2Name3, Ec2Instance4, Ec2Name4, Ec2Instance5, Ec2Name5]
      - Label: {default: "3. RDS targets (up to 5)"}
        Parameters: [RdsInstance1, RdsName1, RdsLogGroup1, RdsInstance2, RdsName2, RdsLogGroup2, RdsInstance3, RdsName3, RdsLogGroup3, RdsInstance4, RdsName4, RdsLogGroup4, RdsInstance5, RdsName5, RdsLogGroup5]
      - Label: {default: "4. Metric thresholds"}
        Parameters: [AlarmPeriodSeconds, AlarmEvaluationPeriods, Ec2CpuThresholdPercent, Ec2DiskFreeThresholdPercent, RdsCpuThresholdPercent, RdsFreeStorageThresholdBytes]
      - Label: {default: "5. Post-transition metric suppression"}
        Parameters: [StartupSuppressionMinutes, ShutdownSuppressionMinutes, RebootSuppressionMinutes]
      - Label: {default: "6. Notification destinations"}
        Parameters: [EmailAddress, SmsPhoneNumber, EnableTeams, TeamsTenantId, TeamsTeamId, TeamsChannelId]
      - Label: {default: "7. Routes by notification type"}
        Parameters: [NotificationAChannels, NotificationA2Channels, NotificationBChannels, NotificationCChannels, NotificationDChannels, NotificationEChannels, NotificationFChannels]
      - Label: {default: "8. Windows CloudWatch Agent (optional)"}
        Parameters: [ConfigureWindowsAgents, Ec2IamRoleName]
    ParameterLabels:
      RdsFreeStorageThresholdBytes: {default: "RDS free-storage threshold (bytes; 20 GiB = 21474836480)"}
      Ec2IamRoleName: {default: "IAM role name shared by the target EC2 instances"}

Parameters:
  ProjectName: {Type: String, Default: separan-monitor, AllowedPattern: "^[A-Za-z][A-Za-z0-9-]{2,31}$"}
  NotificationTimezone: {Type: String, Default: Asia/Tokyo}
  HistoryRetentionDays: {Type: Number, Default: 30, MinValue: 1, MaxValue: 365}
  DuplicateSuppressionMinutes: {Type: Number, Default: 30, MinValue: 1, MaxValue: 1440}
  StatusCheckSchedule: {Type: String, Default: "rate(5 minutes)"}

  Ec2Instance1: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name1: {Type: String, Default: EC2-1}
  Ec2Instance2: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name2: {Type: String, Default: EC2-2}
  Ec2Instance3: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name3: {Type: String, Default: EC2-3}
  Ec2Instance4: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name4: {Type: String, Default: EC2-4}
  Ec2Instance5: {Type: String, Default: "", AllowedPattern: "^$|^i-[0-9a-f]{8}([0-9a-f]{9})?$"}
  Ec2Name5: {Type: String, Default: EC2-5}

  RdsInstance1: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName1: {Type: String, Default: RDS-1}
  RdsLogGroup1: {Type: String, Default: "", Description: "Existing RDS CloudWatch Logs log group (for example, /aws/rds/instance/db/error)."}
  RdsInstance2: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName2: {Type: String, Default: RDS-2}
  RdsLogGroup2: {Type: String, Default: ""}
  RdsInstance3: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName3: {Type: String, Default: RDS-3}
  RdsLogGroup3: {Type: String, Default: ""}
  RdsInstance4: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName4: {Type: String, Default: RDS-4}
  RdsLogGroup4: {Type: String, Default: ""}
  RdsInstance5: {Type: String, Default: "", AllowedPattern: "^$|^[A-Za-z][A-Za-z0-9-]{0,62}$"}
  RdsName5: {Type: String, Default: RDS-5}
  RdsLogGroup5: {Type: String, Default: ""}

  AlarmPeriodSeconds: {Type: Number, Default: 300, AllowedValues: [60, 300]}
  AlarmEvaluationPeriods: {Type: Number, Default: 3, MinValue: 1, MaxValue: 12}
  Ec2CpuThresholdPercent: {Type: Number, Default: 90, MinValue: 1, MaxValue: 100}
  Ec2DiskFreeThresholdPercent: {Type: Number, Default: 15, MinValue: 1, MaxValue: 100}
  RdsCpuThresholdPercent: {Type: Number, Default: 90, MinValue: 1, MaxValue: 100}
  RdsFreeStorageThresholdBytes: {Type: Number, Default: 21474836480, MinValue: 104857600}
  StartupSuppressionMinutes: {Type: Number, Default: 15, MinValue: 0, MaxValue: 1440}
  ShutdownSuppressionMinutes: {Type: Number, Default: 5, MinValue: 0, MaxValue: 1440}
  RebootSuppressionMinutes: {Type: Number, Default: 15, MinValue: 0, MaxValue: 1440}

  EmailAddress: {Type: String, Default: "", Description: "Leave empty to disable email. SNS subscription confirmation is required."}
  SmsPhoneNumber: {Type: String, Default: "", AllowedPattern: "^$|^\\+[1-9][0-9]{7,14}$", Description: "E.164 format. Leave empty to disable SMS."}
  EnableTeams: {Type: String, Default: "false", AllowedValues: ["true", "false"]}
  TeamsTenantId: {Type: String, Default: "", AllowedPattern: "^$|^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$", Description: "Leave empty when Teams is disabled. Microsoft Entra tenant GUID."}
  TeamsTeamId: {Type: String, Default: "", AllowedPattern: "^$|^[0-9A-Fa-f]{8}(-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$", Description: "Leave empty when Teams is disabled. Microsoft Teams team GUID."}
  TeamsChannelId: {Type: String, Default: "", AllowedPattern: "^$|^([a-zA-Z0-9-_=+/.,])*%3[aA]([a-zA-Z0-9-_=+/.,])*%40([a-zA-Z0-9-_=+/.,])*$", Description: "Leave empty when Teams is disabled. URL-encoded channel ID shown by Amazon Q."}
  NotificationAChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$", Description: "Comma-separated list containing email, sms, or teams."}
  NotificationA2Channels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationBChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationCChannels: {Type: String, Default: "email", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationDChannels: {Type: String, Default: "email,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationEChannels: {Type: String, Default: "email", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  NotificationFChannels: {Type: String, Default: "email,sms,teams", AllowedPattern: "^$|^(email|sms|teams)(,(email|sms|teams))*$"}
  ConfigureWindowsAgents: {Type: String, Default: "false", AllowedValues: ["true", "false"]}
  Ec2IamRoleName: {Type: String, Default: "", Description: "Required when ConfigureWindowsAgents=true. The role must already be attached to every target EC2 instance."}

Rules:
  WindowsAgentRoleRequired:
    RuleCondition: !Equals [!Ref ConfigureWindowsAgents, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref Ec2IamRoleName, ""]]
        AssertDescription: ConfigureWindowsAgents=true requires Ec2IamRoleName.
  TeamsIdentifiersRequired:
    RuleCondition: !Equals [!Ref EnableTeams, "true"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref TeamsTenantId, ""]]
          - !Not [!Equals [!Ref TeamsTeamId, ""]]
          - !Not [!Equals [!Ref TeamsChannelId, ""]]
        AssertDescription: EnableTeams=true requires tenant, team, and channel IDs.

Conditions:
  HasEc21: !Not [!Equals [!Ref Ec2Instance1, ""]]
  HasEc22: !Not [!Equals [!Ref Ec2Instance2, ""]]
  HasEc23: !Not [!Equals [!Ref Ec2Instance3, ""]]
  HasEc24: !Not [!Equals [!Ref Ec2Instance4, ""]]
  HasEc25: !Not [!Equals [!Ref Ec2Instance5, ""]]
  HasRds1: !Not [!Equals [!Ref RdsInstance1, ""]]
  HasRds2: !Not [!Equals [!Ref RdsInstance2, ""]]
  HasRds3: !Not [!Equals [!Ref RdsInstance3, ""]]
  HasRds4: !Not [!Equals [!Ref RdsInstance4, ""]]
  HasRds5: !Not [!Equals [!Ref RdsInstance5, ""]]
  HasRdsLog1: !And [!Condition HasRds1, !Not [!Equals [!Ref RdsLogGroup1, ""]]]
  HasRdsLog2: !And [!Condition HasRds2, !Not [!Equals [!Ref RdsLogGroup2, ""]]]
  HasRdsLog3: !And [!Condition HasRds3, !Not [!Equals [!Ref RdsLogGroup3, ""]]]
  HasRdsLog4: !And [!Condition HasRds4, !Not [!Equals [!Ref RdsLogGroup4, ""]]]
  HasRdsLog5: !And [!Condition HasRds5, !Not [!Equals [!Ref RdsLogGroup5, ""]]]
  HasEmail: !Not [!Equals [!Ref EmailAddress, ""]]
  HasSms: !Not [!Equals [!Ref SmsPhoneNumber, ""]]
  UseTeams: !Equals [!Ref EnableTeams, "true"]
  ConfigureAgents: !Equals [!Ref ConfigureWindowsAgents, "true"]
  ConfigureAgentEc21: !And [!Condition ConfigureAgents, !Condition HasEc21]
  ConfigureAgentEc22: !And [!Condition ConfigureAgents, !Condition HasEc22]
  ConfigureAgentEc23: !And [!Condition ConfigureAgents, !Condition HasEc23]
  ConfigureAgentEc24: !And [!Condition ConfigureAgents, !Condition HasEc24]
  ConfigureAgentEc25: !And [!Condition ConfigureAgents, !Condition HasEc25]

Resources:
  RuntimeInstallerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: install-separan-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"}
              - {Effect: Allow, Action: s3:PutObject, Resource: !Sub "${MonitorConfigBucket.Arn}/runtime/*"}
  RuntimeInstallerFunction:
