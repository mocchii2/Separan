  Log2Function:
    Type: AWS::Lambda::Function
    Properties:
      Description: Converts Windows/RDS logs and RDS events into normalized notify candidates.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt ProcessorRole.Arn
      Environment:
        Variables:
          INGRESS_TOPIC: !Ref NotifyIngressTopic
          KEYWORDS: ERROR,CRITICAL,重大
          EC2_IDS: !Join [",", [!Ref Ec2Instance1, !Ref Ec2Instance2, !Ref Ec2Instance3, !Ref Ec2Instance4, !Ref Ec2Instance5]]
          EC2_NAMES: !Join [",", [!Ref Ec2Name1, !Ref Ec2Name2, !Ref Ec2Name3, !Ref Ec2Name4, !Ref Ec2Name5]]
          RDS_IDS: !Join [",", [!Ref RdsInstance1, !Ref RdsInstance2, !Ref RdsInstance3, !Ref RdsInstance4, !Ref RdsInstance5]]
          RDS_NAMES: !Join [",", [!Ref RdsName1, !Ref RdsName2, !Ref RdsName3, !Ref RdsName4, !Ref RdsName5]]
      Code:
        ZipFile: |
          import base64, gzip, json, os
          import xml.etree.ElementTree as ET
          import boto3
          sns=boto3.client("sns"); TOPIC=os.environ["INGRESS_TOPIC"]; KEYWORDS=[v.casefold() for v in os.environ["KEYWORDS"].split(",") if v]
          def names(ids_key,names_key):
              ids=os.environ[ids_key].split(","); labels=os.environ[names_key].split(","); return {v:labels[i] for i,v in enumerate(ids) if v}
          EC2,RDS=names("EC2_IDS","EC2_NAMES"),names("RDS_IDS","RDS_NAMES")
          def send(kind,rtype,rid,rname,source,message,**extra):
              c={"notification_type":kind,"resource_type":rtype,"resource_id":rid,"resource_name":rname or rid,"source":source,"message":str(message)[:16000],"state":extra.pop("state","ALARM"),"title":extra.pop("title",source)}; c.update(extra); sns.publish(TopicArn=TOPIC,Message=json.dumps(c,ensure_ascii=False))
          def parse(message):
              try:
                  value=json.loads(message)
                  if not isinstance(value,dict): return {},message
              except Exception: return {},message
              return value,str(value.get("Message") or value.get("message") or message)
          def parse_windows(message):
              try:
                  root=ET.fromstring(message); system=root.find("{*}System"); rendering=root.find("{*}RenderingInfo")
                  provider=system.find("{*}Provider") if system is not None else None; event_id=system.findtext("{*}EventID","") if system is not None else ""; level_code=system.findtext("{*}Level","") if system is not None else ""; rendered=rendering.findtext("{*}Message","") if rendering is not None else ""
                  levels={"1":"CRITICAL","2":"ERROR","3":"WARNING","4":"INFORMATION","5":"VERBOSE"}; return {"source":provider.attrib.get("Name","") if provider is not None else "","event_id":event_id,"level":levels.get(level_code,level_code)},rendered or message
              except (ET.ParseError,ValueError): return {},message
          def logs(event):
              payload=json.loads(gzip.decompress(base64.b64decode(event["awslogs"]["data"]))); group=payload.get("logGroup",""); stream=payload.get("logStream",""); is_rds="/aws/rds/" in group; rid=stream.split("/")[0]
              if is_rds:
                  parts=group.split("/"); rid=parts[4] if len(parts)>4 else stream
              for item in payload.get("logEvents",[]):
                  raw=item.get("message",""); meta,content=parse(raw); matched=any(k in content.casefold() for k in KEYWORDS)
                  if is_rds and rid in RDS and matched: send("D","RDS",rid,RDS[rid],group,content,title="RDS log keyword")
                  if not is_rds and rid in EC2:
                      if not meta: meta,content=parse_windows(raw); matched=any(k in content.casefold() for k in KEYWORDS)
                      source=meta.get("Source") or meta.get("source") or group.rsplit("/",1)[-1]; event_id=meta.get("EventID") or meta.get("event_id") or meta.get("EventId") or ""; level=str(meta.get("Level") or meta.get("level") or "").upper()
                      if matched: send("B","EC2",rid,EC2[rid],group,content,title="Windows log keyword",windows_source=str(source),event_id=str(event_id))
                      send("C","EC2",rid,EC2[rid],group,content,title="Windows event",windows_source=str(source),event_id=str(event_id),event_level=level)
          def rds_event(event):
              detail=event.get("detail",{}); rid=detail.get("SourceIdentifier") or detail.get("SourceArn","").rsplit(":",1)[-1]
              if rid in RDS:
                  categories=detail.get("EventCategories",[]); send("E","RDS",rid,RDS[rid],"EventBridge RDS",detail.get("Message") or json.dumps(detail,ensure_ascii=False),title="RDS service event",event_id=",".join(categories) if isinstance(categories,list) else str(categories))
          def handler(event,context):
              if "awslogs" in event: logs(event)
              elif event.get("source")=="aws.rds": rds_event(event)
              return {"ok":True}

  StatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Polls and receives EC2/RDS transitions, stores state, and sends F notifications.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ProcessorRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref MonitorTable
          INGRESS_TOPIC: !Ref NotifyIngressTopic
          HISTORY_DAYS: !Ref HistoryRetentionDays
          STARTUP_SUPPRESSION: !Ref StartupSuppressionMinutes
          SHUTDOWN_SUPPRESSION: !Ref ShutdownSuppressionMinutes
          REBOOT_SUPPRESSION: !Ref RebootSuppressionMinutes
          EC2_IDS: !Join [",", [!Ref Ec2Instance1, !Ref Ec2Instance2, !Ref Ec2Instance3, !Ref Ec2Instance4, !Ref Ec2Instance5]]
          EC2_NAMES: !Join [",", [!Ref Ec2Name1, !Ref Ec2Name2, !Ref Ec2Name3, !Ref Ec2Name4, !Ref Ec2Name5]]
          RDS_IDS: !Join [",", [!Ref RdsInstance1, !Ref RdsInstance2, !Ref RdsInstance3, !Ref RdsInstance4, !Ref RdsInstance5]]
          RDS_NAMES: !Join [",", [!Ref RdsName1, !Ref RdsName2, !Ref RdsName3, !Ref RdsName4, !Ref RdsName5]]
      Code:
        ZipFile: |
          import json,os,time
          import boto3
          from botocore.exceptions import ClientError
          ddb,ec2,rds,sns=boto3.client("dynamodb"),boto3.client("ec2"),boto3.client("rds"),boto3.client("sns"); TABLE=os.environ["TABLE_NAME"]; TOPIC=os.environ["INGRESS_TOPIC"]
          def mapping(ik,nk):
              ids=os.environ[ik].split(","); names=os.environ[nk].split(","); return {v:names[i] for i,v in enumerate(ids) if v}
          EC2,RDS=mapping("EC2_IDS","EC2_NAMES"),mapping("RDS_IDS","RDS_NAMES")
          def key(t,rid): return {"pk":{"S":f"STATE#{t}#{rid}"},"sk":{"S":"CURRENT"}}
          def previous(t,rid): return ddb.get_item(TableName=TABLE,Key=key(t,rid),ConsistentRead=True).get("Item",{})
          def grace(state,old):
              if state in ("stopped","stopping"): return int(os.environ["SHUTDOWN_SUPPRESSION"])*60
              if state=="rebooting" or old=="rebooting": return int(os.environ["REBOOT_SUPPRESSION"])*60
              if state in ("running","available","pending","starting"): return int(os.environ["STARTUP_SUPPRESSION"])*60
              return 0
          def store(t,rid,state,old,item,apply_grace):
              now=int(time.time()); previous=item.get("previous_state",{}).get("S",""); changed_at=int(item.get("changed_at",{}).get("N",str(now))); suppress_until=int(item.get("suppress_metrics_until",{}).get("N","0"))
              if apply_grace: previous=old or ""; changed_at=now; suppress_until=now+grace(state,old)
              ddb.put_item(TableName=TABLE,Item={**key(t,rid),"state":{"S":state},"previous_state":{"S":previous},"changed_at":{"N":str(changed_at)},"suppress_metrics_until":{"N":str(suppress_until)},"expires_at":{"N":str(now+int(os.environ["HISTORY_DAYS"])*86400)}})
          def notify(t,rid,name,state,old,source,message): sns.publish(TopicArn=TOPIC,Message=json.dumps({"notification_type":"F","resource_type":t,"resource_id":rid,"resource_name":name,"state":state,"previous_state":old or "unknown","source":source,"title":"Resource state change","message":message},ensure_ascii=False))
          def transition(t,rid,name,state,source,message,force=False):
              item=previous(t,rid); old=item.get("state",{}).get("S",""); normalized=state.casefold(); public="reboot_completed" if old=="rebooting" and normalized in ("running","available") else normalized; changed=bool(old and old!=normalized); store(t,rid,normalized,old,item,changed or force)
              if changed or force: notify(t,rid,name,public,old,source,message)
          def scheduled():
              for rid,name in EC2.items():
                  try:
                      response=ec2.describe_instances(InstanceIds=[rid]); instances=[i for reservation in response.get("Reservations",[]) for i in reservation.get("Instances",[])]; state=instances[0].get("State",{}).get("Name","unknown") if instances else "not_found"
                  except ClientError as exc:
                      code=exc.response.get("Error",{}).get("Code","")
                      if code not in ("InvalidInstanceID.NotFound","InvalidInstanceID.Malformed"):
                          item=previous("EC2",rid); notify("EC2",rid,name,"check_failed",item.get("state",{}).get("S",""),"EventBridge periodic check",f"EC2 state check failed: {code}"); continue
                      state="not_found"
                  transition("EC2",rid,name,state,"EventBridge periodic check","Periodic EC2 state confirmation")
              for rid,name in RDS.items():
                  try: state=rds.describe_db_instances(DBInstanceIdentifier=rid)["DBInstances"][0]["DBInstanceStatus"]
                  except ClientError as exc:
                      code=exc.response.get("Error",{}).get("Code","")
                      if code!="DBInstanceNotFound":
                          item=previous("RDS",rid); notify("RDS",rid,name,"check_failed",item.get("state",{}).get("S",""),"EventBridge periodic check",f"RDS state check failed: {code}"); continue
                      state="not_found"
                  transition("RDS",rid,name,state,"EventBridge periodic check","Periodic RDS state confirmation")
          def ec2_state(event):
              detail=event.get("detail",{}); rid=detail.get("instance-id","")
              if rid in EC2: transition("EC2",rid,EC2[rid],detail.get("state","unknown"),"EC2 push event",f"EC2 reported state {detail.get('state','unknown')}",True)
          def rds_state(event):
              detail=event.get("detail",{}); rid=detail.get("SourceIdentifier") or detail.get("SourceArn","").rsplit(":",1)[-1]; message=str(detail.get("Message","")); text=message.casefold(); state="rebooting" if "reboot" in text else ("stopped" if "stop" in text else ("available" if "start" in text or "available" in text else ""))
              if rid in RDS and state: transition("RDS",rid,RDS[rid],state,"RDS push event",message,True)
          def cloudtrail(event):
              detail=event.get("detail",{}); name=detail.get("eventName",""); request=detail.get("requestParameters") or {}
              if detail.get("eventSource")=="ec2.amazonaws.com":
                  state="rebooting" if name=="RebootInstances" else ("stopping" if name=="StopInstances" else "pending")
                  for item in request.get("instancesSet",{}).get("items",[]):
                      rid=item.get("instanceId","")
                      if rid in EC2: transition("EC2",rid,EC2[rid],state,"CloudTrail API push",name,True)
              if detail.get("eventSource")=="rds.amazonaws.com":
                  rid=request.get("dBInstanceIdentifier") or request.get("dbInstanceIdentifier") or ""; state="rebooting" if name=="RebootDBInstance" else ("stopping" if name=="StopDBInstance" else "starting")
                  if rid in RDS: transition("RDS",rid,RDS[rid],state,"CloudTrail API push",name,True)
          def handler(event,context):
              source,kind=event.get("source",""),event.get("detail-type","")
              if source=="aws.events": scheduled()
              elif source=="aws.ec2" and kind=="EC2 Instance State-change Notification": ec2_state(event)
              elif source=="aws.rds" and kind=="RDS DB Instance Event": rds_state(event)
              elif kind=="AWS API Call via CloudTrail": cloudtrail(event)
              return {"ok":True}

