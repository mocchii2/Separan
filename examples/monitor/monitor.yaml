                  raw=record.get("Sns",{}).get("Message","{}")
                  try: value=json.loads(raw)
                  except Exception: value={"notification_type":"F","message":raw}
                  process(alarm(value) if "AlarmName" in value else value)
              return {"processed":len(event.get("Records",[]))}

