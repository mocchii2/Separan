  InstallAgent2: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc22, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance2]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent3: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc23, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance3]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent4: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc24, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance4]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent5: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc25, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance5]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  ConfigureAgent1:
    Type: AWS::SSM::Association
    Condition: ConfigureAgentEc21
    DependsOn: [InstallAgent1, Ec2AgentManagedPolicy]
    Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance1]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}
  ConfigureAgent2: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc22, DependsOn: [InstallAgent2, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance2]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent3: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc23, DependsOn: [InstallAgent3, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance3]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent4: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc24, DependsOn: [InstallAgent4, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance4]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent5: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc25, DependsOn: [InstallAgent5, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance5]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}

