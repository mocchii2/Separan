          def process(c):
              epoch=int(time.time()); c.setdefault("title",TYPE_NAMES.get(c.get("notification_type"),"Monitor event")); c.setdefault("message","")
              suppression=load(os.environ["SUPPRESSION_KEY"],{"rules":[]}); holidays=load(os.environ["HOLIDAY_KEY"],{"weekly":[],"dates":[]})
              reason="USER_SUPPRESSION_RULE" if any(rule_match(c,r) for r in suppression.get("rules",[])) else holiday(holidays,epoch)
              if not reason and transition_grace(c,epoch): reason="STATE_TRANSITION_GRACE"
              reservation=None
