  Ec2CpuAlarm4: {Type: AWS::CloudWatch::Alarm, Condition: HasEc24, Properties: {AlarmName: !Sub "${ProjectName}-A-EC2-CPU-4", AlarmDescription: !Sub '{"notification_type":"A","resource_type":"EC2","resource_id":"${Ec2Instance4}","resource_name":"${Ec2Name4}","metric":"CPUUtilization"}', Namespace: AWS/EC2, MetricName: CPUUtilization, Dimensions: [{Name: InstanceId, Value: !Ref Ec2Instance4}], Statistic: Average, Period: !Ref AlarmPeriodSeconds, EvaluationPeriods: !Ref AlarmEvaluationPeriods, Threshold: !Ref Ec2CpuThresholdPercent, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: missing, AlarmActions: [!Ref NotifyIngressTopic], OKActions: [!Ref NotifyIngressTopic]}}
  Ec2CpuAlarm5: {Type: AWS::CloudWatch::Alarm, Condition: HasEc25, Properties: {AlarmName: !Sub "${ProjectName}-A-EC2-CPU-5", AlarmDescription: !Sub '{"notification_type":"A","resource_type":"EC2","resource_id":"${Ec2Instance5}","resource_name":"${Ec2Name5}","metric":"CPUUtilization"}', Namespace: AWS/EC2, MetricName: CPUUtilization, Dimensions: [{Name: InstanceId, Value: !Ref Ec2Instance5}], Statistic: Average, Period: !Ref AlarmPeriodSeconds, EvaluationPeriods: !Ref AlarmEvaluationPeriods, Threshold: !Ref Ec2CpuThresholdPercent, ComparisonOperator: GreaterThanOrEqualToThreshold, TreatMissingData: missing, AlarmActions: [!Ref NotifyIngressTopic], OKActions: [!Ref NotifyIngressTopic]}}

  Ec2DiskAlarm1:
    Type: AWS::CloudWatch::Alarm
