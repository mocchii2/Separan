  RuntimeArtifact:
    Type: Custom::SeparanRuntimeArtifact
    Properties:
      ServiceToken: !GetAtt RuntimeInstallerFunction.Arn
      Bucket: !Ref MonitorConfigBucket
      Digest: "561695ae4f81c844e9f6898fc0141df90b1ade33d9a5a190d96f4d4ec3e64552"
  MonitorTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}

  MonitorConfigBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  NotifyIngressTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} ingress"}}
  NotifyIngressTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref NotifyIngressTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal: {Service: cloudwatch.amazonaws.com}
            Action: sns:Publish
            Resource: !Ref NotifyIngressTopic
            Condition:
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
  EmailTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} email"}}
  SmsTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} sms"}}
  TeamsTopic: {Type: AWS::SNS::Topic, Properties: {DisplayName: !Sub "${ProjectName} teams"}}
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties: {Protocol: email, Endpoint: !Ref EmailAddress, TopicArn: !Ref EmailTopic}
  SmsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasSms
    Properties: {Protocol: sms, Endpoint: !Ref SmsPhoneNumber, TopicArn: !Ref SmsTopic}

  TeamsRole:
    Type: AWS::IAM::Role
    Condition: UseTeams
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: chatbot.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess]
  TeamsChannel:
    Type: AWS::Chatbot::MicrosoftTeamsChannelConfiguration
    Condition: UseTeams
    Properties:
      ConfigurationName: !Sub "${ProjectName}-teams"
      IamRoleArn: !GetAtt TeamsRole.Arn
      GuardrailPolicies: [arn:aws:iam::aws:policy/ReadOnlyAccess]
      LoggingLevel: ERROR
      SnsTopicArns: [!Ref TeamsTopic]
      TeamId: !Ref TeamsTeamId
      TeamsChannelId: !Ref TeamsChannelId
      TeamsTenantId: !Ref TeamsTenantId
      UserRoleRequired: true

  NotifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: notify
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem], Resource: !GetAtt MonitorTable.Arn}
              - {Effect: Allow, Action: s3:GetObject, Resource: !Sub "${MonitorConfigBucket.Arn}/config/*"}
              - {Effect: Allow, Action: sns:Publish, Resource: [!Ref EmailTopic, !Ref SmsTopic, !Ref TeamsTopic]}

  NotifyFunction:
    Type: AWS::Lambda::Function
    DependsOn: RuntimeArtifact
    Properties:
      Description: Applies suppression, stores every candidate, and sends channel-specific notifications.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt NotifyRole.Arn
      Environment:
        Variables:
          SEPARAN_HANDLER: notify_handler
          TABLE_NAME: !Ref MonitorTable
          CONFIG_BUCKET: !Ref MonitorConfigBucket
          SUPPRESSION_KEY: config/suppression.json
          HOLIDAY_KEY: config/holidays.json
          EMAIL_TOPIC: !Ref EmailTopic
          SMS_TOPIC: !Ref SmsTopic
          TEAMS_TOPIC: !Ref TeamsTopic
          EMAIL_ENABLED: !If [HasEmail, "true", "false"]
          SMS_ENABLED: !If [HasSms, "true", "false"]
          TEAMS_ENABLED: !If [UseTeams, "true", "false"]
          HISTORY_DAYS: !Ref HistoryRetentionDays
          DEDUP_MINUTES: !Ref DuplicateSuppressionMinutes
          DEFAULT_TIMEZONE: !Ref NotificationTimezone
          ROUTES_JSON: !Sub >-
            {"A":"${NotificationAChannels}","A2":"${NotificationA2Channels}","B":"${NotificationBChannels}","C":"${NotificationCChannels}","D":"${NotificationDChannels}","E":"${NotificationEChannels}","F":"${NotificationFChannels}"}
      Code:
        S3Bucket: !Ref MonitorConfigBucket
        S3Key: runtime/separan-monitor.zip

  NotifyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref NotifyFunction, Principal: sns.amazonaws.com, SourceArn: !Ref NotifyIngressTopic}
  NotifySubscription:
    Type: AWS::SNS::Subscription
    Properties: {Protocol: lambda, Endpoint: !GetAtt NotifyFunction.Arn, TopicArn: !Ref NotifyIngressTopic}

  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: processors
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"}
              - {Effect: Allow, Action: sns:Publish, Resource: !Ref NotifyIngressTopic}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem], Resource: !GetAtt MonitorTable.Arn}
              - {Effect: Allow, Action: [ec2:DescribeInstances, rds:DescribeDBInstances], Resource: "*"}

  Log2Function:
    Type: AWS::Lambda::Function
    DependsOn: RuntimeArtifact
    Properties:
      Description: Converts Windows/RDS logs and RDS events into normalized notify candidates.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt ProcessorRole.Arn
      Environment:
        Variables:
          SEPARAN_HANDLER: log2_handler
          INGRESS_TOPIC: !Ref NotifyIngressTopic
          EC2_IDS: !Join [",", [!Ref Ec2Instance1, !Ref Ec2Instance2, !Ref Ec2Instance3, !Ref Ec2Instance4, !Ref Ec2Instance5]]
          EC2_NAMES: !Join [",", [!Ref Ec2Name1, !Ref Ec2Name2, !Ref Ec2Name3, !Ref Ec2Name4, !Ref Ec2Name5]]
          RDS_IDS: !Join [",", [!Ref RdsInstance1, !Ref RdsInstance2, !Ref RdsInstance3, !Ref RdsInstance4, !Ref RdsInstance5]]
          RDS_NAMES: !Join [",", [!Ref RdsName1, !Ref RdsName2, !Ref RdsName3, !Ref RdsName4, !Ref RdsName5]]
      Code:
        S3Bucket: !Ref MonitorConfigBucket
        S3Key: runtime/separan-monitor.zip

  StatusFunction:
    Type: AWS::Lambda::Function
    DependsOn: RuntimeArtifact
    Properties:
      Description: Polls and receives EC2/RDS transitions, stores state, and sends F notifications.
      Runtime: python3.13
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ProcessorRole.Arn
      Environment:
        Variables:
          SEPARAN_HANDLER: status_handler
          TABLE_NAME: !Ref MonitorTable
          INGRESS_TOPIC: !Ref NotifyIngressTopic
          HISTORY_DAYS: !Ref HistoryRetentionDays
          STARTUP_SUPPRESSION: !Ref StartupSuppressionMinutes
          SHUTDOWN_SUPPRESSION: !Ref ShutdownSuppressionMinutes
          REBOOT_SUPPRESSION: !Ref RebootSuppressionMinutes
          EC2_IDS: !Join [",", [!Ref Ec2Instance1, !Ref Ec2Instance2, !Ref Ec2Instance3, !Ref Ec2Instance4, !Ref Ec2Instance5]]
          EC2_NAMES: !Join [",", [!Ref Ec2Name1, !Ref Ec2Name2, !Ref Ec2Name3, !Ref Ec2Name4, !Ref Ec2Name5]]
          RDS_IDS: !Join [",", [!Ref RdsInstance1, !Ref RdsInstance2, !Ref RdsInstance3, !Ref RdsInstance4, !Ref RdsInstance5]]
          RDS_NAMES: !Join [",", [!Ref RdsName1, !Ref RdsName2, !Ref RdsName3, !Ref RdsName4, !Ref RdsName5]]
      Code:
        S3Bucket: !Ref MonitorConfigBucket
        S3Key: runtime/separan-monitor.zip

  Log2PermissionFromLogs:
    Type: AWS::Lambda::Permission
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref Log2Function, Principal: !Sub "logs.${AWS::Region}.amazonaws.com", SourceAccount: !Ref AWS::AccountId, SourceArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"}

  WindowsApplicationLogGroup: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: !Sub "/${ProjectName}/windows/application", RetentionInDays: 30}}
  WindowsSystemLogGroup: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: !Sub "/${ProjectName}/windows/system", RetentionInDays: 30}}
  WindowsSecurityLogGroup: {Type: AWS::Logs::LogGroup, Properties: {LogGroupName: !Sub "/${ProjectName}/windows/security", RetentionInDays: 30}}
  WindowsApplicationSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: Log2PermissionFromLogs
    Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref WindowsApplicationLogGroup}
  WindowsSystemSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: Log2PermissionFromLogs
    Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref WindowsSystemLogGroup}
  WindowsSecuritySubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: Log2PermissionFromLogs
    Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref WindowsSecurityLogGroup}
  RdsLogSubscription1: {Type: AWS::Logs::SubscriptionFilter, Condition: HasRdsLog1, DependsOn: Log2PermissionFromLogs, Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref RdsLogGroup1}}
  RdsLogSubscription2: {Type: AWS::Logs::SubscriptionFilter, Condition: HasRdsLog2, DependsOn: Log2PermissionFromLogs, Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref RdsLogGroup2}}
  RdsLogSubscription3: {Type: AWS::Logs::SubscriptionFilter, Condition: HasRdsLog3, DependsOn: Log2PermissionFromLogs, Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref RdsLogGroup3}}
  RdsLogSubscription4: {Type: AWS::Logs::SubscriptionFilter, Condition: HasRdsLog4, DependsOn: Log2PermissionFromLogs, Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref RdsLogGroup4}}
  RdsLogSubscription5: {Type: AWS::Logs::SubscriptionFilter, Condition: HasRdsLog5, DependsOn: Log2PermissionFromLogs, Properties: {DestinationArn: !GetAtt Log2Function.Arn, FilterPattern: "", LogGroupName: !Ref RdsLogGroup5}}

  StatusScheduleRule:
    Type: AWS::Events::Rule
    Properties: {ScheduleExpression: !Ref StatusCheckSchedule, State: ENABLED, Targets: [{Arn: !GetAtt StatusFunction.Arn, Id: status-periodic}]}
  Ec2StateRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern: {source: [aws.ec2], detail-type: [EC2 Instance State-change Notification]}
      State: ENABLED
      Targets: [{Arn: !GetAtt StatusFunction.Arn, Id: ec2-state}]
  RdsEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern: {source: [aws.rds], detail-type: [RDS DB Instance Event]}
      State: ENABLED
      Targets: [{Arn: !GetAtt StatusFunction.Arn, Id: rds-state}, {Arn: !GetAtt Log2Function.Arn, Id: rds-event-log2}]
  ApiStateRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.ec2, aws.rds]
        detail-type: [AWS API Call via CloudTrail]
        detail:
          eventSource: [ec2.amazonaws.com, rds.amazonaws.com]
          eventName: [StartInstances, StopInstances, RebootInstances, StartDBInstance, StopDBInstance, RebootDBInstance]
      State: ENABLED
      Targets: [{Arn: !GetAtt StatusFunction.Arn, Id: api-state}]
  StatusSchedulePermission: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref StatusFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt StatusScheduleRule.Arn}}
  Ec2StatePermission: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref StatusFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt Ec2StateRule.Arn}}
  RdsStatePermission: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref StatusFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt RdsEventRule.Arn}}
  RdsLog2Permission: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref Log2Function, Principal: events.amazonaws.com, SourceArn: !GetAtt RdsEventRule.Arn}}
  ApiStatePermission: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref StatusFunction, Principal: events.amazonaws.com, SourceArn: !GetAtt ApiStateRule.Arn}}

  ConfigBootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: seed-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"}
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: !Sub "${MonitorConfigBucket.Arn}/config/*"}
  ConfigBootstrapFunction:
    Type: AWS::Lambda::Function
    DependsOn: RuntimeArtifact
    Properties:
      Runtime: python3.13
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt ConfigBootstrapRole.Arn
      Environment:
        Variables:
          SEPARAN_HANDLER: config_handler
      Code:
        S3Bucket: !Ref MonitorConfigBucket
        S3Key: runtime/separan-monitor.zip

  ConfigBootstrap:
    Type: Custom::SeparanMonitorConfig
    Properties: {ServiceToken: !GetAtt ConfigBootstrapFunction.Arn, Bucket: !Ref MonitorConfigBucket, Timezone: !Ref NotificationTimezone}

  CloudWatchAgentConfig:
    Type: AWS::SSM::Parameter
    Condition: ConfigureAgents
    Properties:
      Type: String
      Description: !Sub "${ProjectName} Windows CloudWatch Agent configuration"
      Value: !Sub |
        {"agent":{"metrics_collection_interval":60},"metrics":{"namespace":"CWAgent","append_dimensions":{"InstanceId":"${!aws:InstanceId}"},"aggregation_dimensions":[["InstanceId"]],"metrics_collected":{"LogicalDisk":{"measurement":[{"name":"% Free Space","rename":"LogicalDiskFreeSpacePercent","unit":"Percent"}],"resources":["_Total"],"metrics_collection_interval":60,"drop_original_metrics":["% Free Space"]}}},"logs":{"logs_collected":{"windows_events":{"collect_list":[{"event_name":"Application","event_levels":["WARNING","ERROR","CRITICAL"],"event_format":"xml","log_group_name":"/${ProjectName}/windows/application","log_stream_name":"{instance_id}"},{"event_name":"System","event_levels":["WARNING","ERROR","CRITICAL"],"event_format":"xml","log_group_name":"/${ProjectName}/windows/system","log_stream_name":"{instance_id}"},{"event_name":"Security","event_levels":["WARNING","ERROR","CRITICAL"],"event_format":"xml","log_group_name":"/${ProjectName}/windows/security","log_stream_name":"{instance_id}"}]}}}}
  Ec2AgentManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ConfigureAgents
    Properties:
      Roles: [!Ref Ec2IamRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Action: cloudwatch:PutMetricData, Resource: "*"}
          - {Effect: Allow, Action: [logs:CreateLogStream, logs:DescribeLogStreams, logs:PutLogEvents], Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${ProjectName}/windows/*"}
          - {Effect: Allow, Action: ssm:GetParameter, Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${CloudWatchAgentConfig}"}

  InstallAgent1:
    Type: AWS::SSM::Association
    Condition: ConfigureAgentEc21
    Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance1]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}
  InstallAgent2: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc22, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance2]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent3: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc23, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance3]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent4: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc24, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance4]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  InstallAgent5: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc25, Properties: {Name: AWS-ConfigureAWSPackage, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance5]}], Parameters: {action: [Install], name: [AmazonCloudWatchAgent]}}}
  ConfigureAgent1:
    Type: AWS::SSM::Association
    Condition: ConfigureAgentEc21
    DependsOn: [InstallAgent1, Ec2AgentManagedPolicy]
    Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance1]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}
  ConfigureAgent2: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc22, DependsOn: [InstallAgent2, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance2]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent3: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc23, DependsOn: [InstallAgent3, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance3]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent4: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc24, DependsOn: [InstallAgent4, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance4]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}
  ConfigureAgent5: {Type: AWS::SSM::Association, Condition: ConfigureAgentEc25, DependsOn: [InstallAgent5, Ec2AgentManagedPolicy], Properties: {Name: AmazonCloudWatch-ManageAgent, WaitForSuccessTimeoutSeconds: 900, Targets: [{Key: InstanceIds, Values: [!Ref Ec2Instance5]}], Parameters: {action: [configure], mode: [ec2], optionalConfigurationSource: [ssm], optionalConfigurationLocation: [!Ref CloudWatchAgentConfig], optionalRestart: ["yes"]}}}

  Ec2CpuAlarm1:
    Type: AWS::CloudWatch::Alarm
