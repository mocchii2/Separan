version: 1
aws:
  account_id: "123456789012"
  region: ap-northeast-1

resources:
  ec2:
    - name: WEB01
      instance_id: i-0123456789abcdef0
      os: windows
      metrics:
        cpu:
          enabled: true
          threshold_percent: 90
          evaluation_minutes: 5
      logs:
        - name: application
          path: 'C:\App\logs\application.log'
          encoding: utf-8
  rds:
    - name: APPDB01
      identifier: appdb01
      log_group: /aws/rds/instance/appdb01/error

log_rules:
  include: [ERROR, CRITICAL, 重大]
  exclude: [known harmless error]

transition_suppression:
  startup_minutes: 15
  reboot_minutes: 10
  shutdown_minutes: 5

deduplication:
  window_minutes: 30

notifications:
  A: [email, teams]
  A2: [email, teams]
  B: [email, teams]
  C: [email]
  D: [email, teams]
  E: [email]
  F: [email, sms, teams]
